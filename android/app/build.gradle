plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.ferbatech.listandsplit"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    flavorDimensions "environment"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ferbatech.listandsplit"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "List & Split Dev"
            manifestPlaceholders = [
                authRedirectScheme: "com.ferbatech.listandsplit.dev",
            ]
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "List & Split"
            manifestPlaceholders = [
                authRedirectScheme: "com.ferbatech.listandsplit",
            ]
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

gradle.taskGraph.whenReady { graph ->
    def ambiguousVariantTasks = [
        "assembleDebug",
        "assembleProfile",
        "assembleRelease",
        "bundleDebug",
        "bundleProfile",
        "bundleRelease",
    ]
    if (ambiguousVariantTasks.any { graph.hasTask("${project.path}:${it}") }) {
        throw new GradleException(
            "Choose --flavor dev or --flavor prod explicitly; unflavored Android builds are disabled."
        )
    }
}
