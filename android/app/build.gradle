plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def productionProperties = new Properties()
rootProject.file('production.properties').withInputStream { productionProperties.load(it) }
def productionProjectRef = productionProperties.getProperty('projectRef', '')
if (productionProjectRef && (!(productionProjectRef ==~ /[a-z]{20}/) ||
        productionProjectRef == 'lzwsgxziqxpxwyalkfuy')) {
    throw new GradleException('Invalid approved Production project reference.')
}
def signingNames = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
def releaseSigning = signingNames.collectEntries { [it, System.getenv("LIST_AND_SPLIT_RELEASE_${it}")] }
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }

// Public Firebase client settings arrive through the same local build input as
// Supabase. No server credential, analytics, second Auth system or paid service.
def clientDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encoded ->
        def pair = new String(encoded.decodeBase64(), 'UTF-8').split('=', 2)
        if (pair.length == 2) clientDefines[pair[0]] = pair[1]
    }
}
def firebaseProject = clientDefines['FIREBASE_PROJECT_ID'] ?: ''
def firebaseFields = ['FIREBASE_PROJECT_ID','FIREBASE_APP_ID','FIREBASE_SENDER_ID','FIREBASE_API_KEY']
def firebaseCount = firebaseFields.count { clientDefines[it] }
if (firebaseCount != 0 && firebaseCount != 4) {
    throw new GradleException('Firebase configuration must be complete or absent.')
}
if (firebaseProject && !(firebaseProject ==~ /list-and-split-[a-z0-9-]+/)) {
    throw new GradleException('Firebase must use the dedicated List & Split project.')
}

android {
    namespace "com.ferbatech.listandsplit"
    compileSdk 36
    ndkVersion '28.2.13676358'
    buildFeatures { buildConfig true }

    flavorDimensions "environment"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ferbatech.listandsplit"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            buildConfigField 'String', 'PRODUCTION_PROJECT_REF', '""'
            resValue "string", "app_name", "List & Split Dev"
            resValue "string", "google_app_id", clientDefines['FIREBASE_APP_ID'] ?: ''
            resValue "string", "gcm_defaultSenderId", clientDefines['FIREBASE_SENDER_ID'] ?: ''
            resValue "string", "google_api_key", clientDefines['FIREBASE_API_KEY'] ?: ''
            resValue "string", "project_id", firebaseProject
            resValue "string", "push_supabase_key", clientDefines['SUPABASE_PUBLISHABLE_KEY'] ?: ''
            manifestPlaceholders = [
                authRedirectScheme: "com.ferbatech.listandsplit.dev",
            ]
        }
        prod {
            dimension "environment"
            buildConfigField 'String', 'PRODUCTION_PROJECT_REF', "\"${productionProjectRef}\""
            resValue "string", "app_name", "List & Split"
            manifestPlaceholders = [
                authRedirectScheme: "com.ferbatech.listandsplit",
            ]
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigning.STORE_FILE)
                storePassword releaseSigning.STORE_PASSWORD
                keyAlias releaseSigning.KEY_ALIAS
                keyPassword releaseSigning.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            ndk { debugSymbolLevel 'FULL' }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:25.1.3'
    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } &&
            !hasReleaseSigning) {
        throw new GradleException('Release signing is required. Load LIST_AND_SPLIT_RELEASE_* locally; never use debug signing.')
    }
    def ambiguousVariantTasks = [
        "assembleDebug",
        "assembleProfile",
        "assembleRelease",
        "bundleDebug",
        "bundleProfile",
        "bundleRelease",
    ]
    if (ambiguousVariantTasks.any { graph.hasTask("${project.path}:${it}") }) {
        throw new GradleException(
            "Choose --flavor dev or --flavor prod explicitly; unflavored Android builds are disabled."
        )
    }
}
